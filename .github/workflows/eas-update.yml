name: Publicar update OTA (canal preview)

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '.nvmrc'
      - 'scripts/check-node-version.cjs'
      - 'eas.json'
      - 'docs/**'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: node scripts/check-node-version.cjs
      - run: npm ci
      - name: Comprobar TypeScript
        run: npx tsc --noEmit

      # EXPO_TOKEN: token de acceso de expo.dev (Account settings -> Access tokens),
      # guardado como secret del repo.
      - name: Publicar el update
        run: npx eas-cli@latest update --channel preview --message "Preview ${GITHUB_SHA}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://itc-backend-1031252664334.us-east1.run.app
          EXPO_PUBLIC_ENABLE_PREMIUM_SIMULATION: "true"
