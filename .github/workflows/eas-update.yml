name: Publicar update OTA (canal preview)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # EXPO_TOKEN: token de acceso de expo.dev (Account settings -> Access tokens),
      # guardado como secret del repo.
      - name: Consultar compilación iOS preview
        run: npx eas-cli@latest build:view 53bce798-7939-41eb-a54c-a88d2b16aec0 --json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://itc-backend-1031252664334.us-east1.run.app
          EXPO_PUBLIC_ENABLE_PREMIUM_SIMULATION: "true"
