name: Compilar iOS y enviar a TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar TypeScript
        run: npx tsc --noEmit
      - name: Compilar y enviar a TestFlight
        run: npx eas-cli@latest build --platform ios --profile production --auto-submit --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
